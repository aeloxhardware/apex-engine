<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-label="Planar layers need support under an overhang; curved layers do not">
  <rect width="1000" height="380" rx="16" fill="#0b1020"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="250" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#e2e8f0">Planar slicer</text>
    <text x="750" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#22d3ee">Apex (curved layers)</text>
  </g>
  <line x1="500" y1="60" x2="500" y2="340" stroke="#334155" stroke-dasharray="6 6"/>
  <!-- left: L-shaped part, planar layers -->
  <g>
    <path d="M110 320 H210 V170 H400 V120 H110 Z" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <g stroke="#64748b" stroke-width="1.5" opacity="0.8">
      <line x1="110" y1="300" x2="210" y2="300"/><line x1="110" y1="280" x2="210" y2="280"/><line x1="110" y1="260" x2="210" y2="260"/>
      <line x1="110" y1="240" x2="210" y2="240"/><line x1="110" y1="220" x2="210" y2="220"/><line x1="110" y1="200" x2="210" y2="200"/>
      <line x1="110" y1="180" x2="210" y2="180"/><line x1="110" y1="160" x2="400" y2="160"/><line x1="110" y1="140" x2="400" y2="140"/>
    </g>
    <path d="M210 170 H400 V320 H210 Z" fill="#ef4444" opacity="0.14" stroke="#ef4444" stroke-dasharray="5 5"/>
    <text x="305" y="250" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#f87171">support</text>
    <line x1="80" y1="320" x2="430" y2="320" stroke="#475569" stroke-width="3"/>
  </g>
  <!-- right: same part, curved layers -->
  <g>
    <path d="M610 320 H710 V170 H900 V120 H610 Z" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <g fill="none" stroke="url(#g)" stroke-width="2.2" stroke-linecap="round">
      <path d="M610 304 H710"/>
      <path d="M610 270 H710"/>
      <path d="M610 236 H694 Q728 236 738 170"/>
      <path d="M610 204 H690 Q752 204 790 170"/>
      <path d="M610 174 H684 Q770 170 842 170"/>
      <path d="M610 148 H900"/>
      <path d="M610 132 H900"/>
    </g>
    <defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="610" y1="0" x2="900" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
    <line x1="580" y1="320" x2="930" y2="320" stroke="#475569" stroke-width="3"/>
    <text x="805" y="250" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#4ade80">nothing underneath</text>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#94a3b8">
    <text x="250" y="362" text-anchor="middle">flat layers → the arm hangs in the air</text>
    <text x="750" y="362" text-anchor="middle">layers follow a scalar field, the head tilts</text>
  </g>
</svg>
