name: CI
on:
  push:
  pull_request:
jobs:
  limites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Limites de taille (cliquet)
        run: python -I scripts/check_limits.py

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Les deux positions du commutateur natif : les tests doivent passer dans les deux (RULES §11.1).
        native: ["0", "1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dépendances figées (empreintes vérifiées)
        run: |
          python -m pip install --require-hashes -r requirements.lock
      - name: Noyau natif (cmake, g++)
        if: matrix.native == '1'
        run: |
          cmake -S cpp -B build-cpp -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -Dpybind11_DIR="$(python -m pybind11 --cmakedir)" -DPython_EXECUTABLE="$(which python)" \
            -DAPEX_LIB_DIR="$GITHUB_WORKSPACE/cpp/lib"
          cmake --build build-cpp -j2
      - name: Licences à jour
        run: python scripts/gen_licences.py --check
      - name: Contrat à jour (schéma et en-tête générés)
        run: python scripts/gen_params.py && git diff --exit-code config/params.schema.json cpp/include/apex/params.hpp
      - name: Tests
        env:
          APEX_USE_CPP: ${{ matrix.native }}
        # Échecs connus PRE-001 (tests/known_failures.txt) : exclus d'ici, exécutés à part dans le job suivant.
        run: |
          python -m pytest -q -p no:cacheprovider tests $(sed -n 's/^\(tests[^ #]*\).*/--deselect \1/p' tests/known_failures.txt)

  echecs-connus:
    # Visibilité des échecs connus : ce job échoue tant que PRE-001 n'est pas résolu, sans bloquer les autres.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: |
          python -m pytest -q -p no:cacheprovider $(sed -n 's/^\(tests[^ #]*\).*/\1/p' tests/known_failures.txt)
